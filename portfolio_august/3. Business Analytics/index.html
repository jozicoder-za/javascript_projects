<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Analytics | DataDash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Business Analytics</h1>
        <p>Turn your Excel and CSV into an interactive dashboard</p>
        <nav>
          <ul>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#upload">Upload Data</a></li>
            <li><a href="#reports">Reports</a></li>
            <li><a href="#settings">Settings</a></li>
          </ul>
        </nav>
      </header>
      <section id="dashboard">
        <h2>Dashboard</h2>
        <p>View key business metrics and insights from your uploaded data.</p>
      </section>
      <section id="upload">
        <h2>Upload Data</h2>
        <p>
          Upload your Excel or CSV files to analyze and visualize your data.
        </p>
        <label for="file-upload">Choose an Excel or CSV file:</label>
        <input
          type="file"
          id="file-upload"
          accept=".csv, .xlsx, .xls"
          name="file-upload"
        />
        <button type="button" id="upload-button">Upload and Analyze</button>
        <p id="upload-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
